name: CI/CD

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  pull_request:
    branches: [main]
  repository_dispatch:
    types: [axor-core-published]

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    services:
      neo4j:
        image: neo4j:5
        env:
          # Disable auth so the integration tests can connect without credentials.
          NEO4J_AUTH: none
        ports:
          - 7687:7687   # Bolt
          - 7474:7474   # HTTP (used by the health check)
        options: >-
          --health-cmd "wget -q -O /dev/null http://localhost:7474 || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 20
          --health-start-period 30s

    env:
      # Presence of this var un-skips tests/test_neo4j_integration.py, which run the
      # real Cypher + full cycle against the neo4j service above. Unset locally → skipped.
      AXOR_TEST_NEO4J_BOLT: bolt://localhost:7687

    steps:
      - uses: actions/checkout@v4

      - name: Log trigger context
        if: github.event_name == 'repository_dispatch'
        run: |
          echo "Triggered by axor-core ${{ github.event.client_payload.version }}"

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Checkout axor-core
        if: github.event_name != 'repository_dispatch'
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/axor-core
          path: axor-core

      - name: Install axor-core from source
        if: github.event_name != 'repository_dispatch'
        run: pip install -e axor-core/

      - name: Install axor-core from PyPI (pinned to triggering version)
        if: github.event_name == 'repository_dispatch'
        run: |
          pip install "axor-core==${{ github.event.client_payload.version }}"

      - name: Install
        run: |
          pip install -e ".[dev,neo4j]"

      - name: Static analysis — no axor-sentinel imports in axor-core
        run: |
          python - << 'EOF'
          import ast, os, sys
          issues = []
          for root, dirs, files in os.walk("axor_sentinel"):
              dirs[:] = [d for d in dirs if not d.startswith("__")]
              for f in files:
                  if not f.endswith(".py"):
                      continue
                  path = os.path.join(root, f)
                  src  = open(path).read()
                  if "import axor_core" in src or "from axor_core" in src:
                      # Only integration/, tests/, and the version-compat shim
                      # may import axor_core.
                      rel = os.path.relpath(path, "axor_sentinel")
                      if not (rel.startswith("integration") or rel.startswith("../tests") or rel == "compatibility.py"):
                          issues.append(f"DEPENDENCY_VIOLATION: {path} imports axor_core outside integration/")
          if issues:
              print("\n".join(issues))
              sys.exit(1)
          print("✓ dependency direction enforced")
          EOF

      - name: Lint
        run: ruff check axor_sentinel/ tests/ bench_run.py --quiet

      - name: Type check
        run: mypy axor_sentinel/

      - name: Run tests
        run: pytest tests/ -v --tb=short

  publish:
    name: Publish to PyPI
    needs: test
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    environment: pypi

    permissions:
      id-token: write   # for trusted publishing

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify tag matches package version
        run: |
          python - << 'EOF'
          import pathlib
          import re
          import sys
          import tomllib

          ref = "${{ github.ref_name }}"
          m = re.fullmatch(r"v(\d+\.\d+\.\d+)", ref)
          if not m:
              print(f"Tag {ref!r} must match vX.Y.Z")
              sys.exit(1)

          tag_version = m.group(1)
          data = tomllib.loads(pathlib.Path("pyproject.toml").read_text(encoding="utf-8"))
          pkg_version = data["project"]["version"]

          if tag_version != pkg_version:
              print(f"Version mismatch: tag={tag_version}, pyproject={pkg_version}")
              sys.exit(1)

          print(f"Version check passed: {pkg_version}")
          EOF

      - name: Build
        run: |
          pip install hatchling build
          python -m build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
