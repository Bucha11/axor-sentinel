[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "axor-sentinel"
version = "0.4.2"
description = "Cross-session behavioral analysis for Axor via weighted resource reputation graph"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.11"
keywords = ["agents", "governance", "security", "reputation", "ai"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

# Base package has no required deps — axor-core is a peer, not a hard dep.
# Install with pip install "axor-sentinel[neo4j]" to enable graph backend.
dependencies = []

[project.optional-dependencies]
neo4j = ["neo4j>=5"]
bench = []   # bench uses only stdlib and the axor-sentinel base package
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    # Bounded on purpose, and the rules stated below. This repo declared no
    # [tool.ruff] section and no upper bound, so CI linted against whatever
    # ruff's DEFAULT rule set happened to be — and the wider default in 0.16
    # reddened the v0.4.0 release run with C408/RUF059/I001 findings in files
    # nobody had touched. A local ruff 0.15 passed the same tree. axor-eval hit
    # this exact failure and fixed it the same way; this repo did not get the
    # fix. An explicit `select` stops the category drift; the ceiling covers a
    # new rule landing inside a category already selected, so a linter release
    # cannot fail a build on its own.
    "ruff>=0.5,<0.17",
    "mypy>=1.10",
]

[project.urls]
Repository = "https://github.com/Bucha11/axor-sentinel"

[tool.hatch.build.targets.wheel]
packages = ["axor_sentinel"]

[tool.ruff]
# py311 is the floor in requires-python; targeting 3.12 here would let the
# pyupgrade rules rewrite code into syntax a supported interpreter cannot parse.
target-version = "py311"
# the width this codebase is written at, matching axor-eval and the control plane.
line-length = 100

[tool.ruff.lint]
# correctness and modernization, stated rather than inherited — the same set
# axor-eval settled on after the same failure.
select = ["E", "F", "I", "UP", "B", "SIM", "ASYNC"]

[tool.ruff.lint.per-file-ignores]
# a test may build a throwaway in a loop or bind a name it never reads; neither
# is a defect in a test the way it is in library code.
"tests/*" = ["B008", "F841"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.coverage.run]
source = ["axor_sentinel"]
omit = ["tests/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "@abstractmethod",
]

[tool.mypy]
# axor-core is a peer dependency referenced only for type-checking (P-34). It may
# ship without stubs, and newer contracts (e.g. observation) can post-date the
# axor-core build CI resolves, so treat its imports as untyped rather than errors.
[[tool.mypy.overrides]]
module = ["axor_core", "axor_core.*"]
ignore_missing_imports = true
